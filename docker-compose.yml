services:
  shareit-db:
    image: postgres:16-alpine
    container_name: shareit-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: shareit
      POSTGRES_USER: shareit
      POSTGRES_PASSWORD: shareit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shareit -d shareit"]
      interval: 5s
      timeout: 5s
      retries: 10
